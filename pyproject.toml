[project]
name = "gpt-2"
version = "0.1.0"
description = "An educational PyTorch package for pre-training and fine-tuning small GPT-2 models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "tensorflow>=2.15.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "tqdm>=4.66",
    "requests"
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["notebooks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
