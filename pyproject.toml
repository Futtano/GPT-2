[project]
name = "gpt-2"
version = "0.1.0"
description = "An educational PyTorch package for pre-training and fine-tuning small GPT-2 models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "tensorflow>=2.15.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "tqdm>=4.66",
    "requests"
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "SIM", "TRY"]
ignore = [
    # Long exception messages are clearer when constructed at the raise site.
    "TRY003",
    # Configuration validation deliberately exposes ValueError consistently.
    "TRY004",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["notebooks"]

# These tests deliberately violate constructor annotations to exercise runtime
# validation. Keep the override local to that boundary-test module.
[[tool.ty.overrides]]
include = ["tests/unit/gpt_2/test_config.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
