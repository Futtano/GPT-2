name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ matrix.python-version }}

      - name: Install locked project and development dependencies
        run: uv sync --locked --dev

      - name: Check lint rules
        run: uv run --locked ruff check src tests

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Check types
        run: uv run --locked ty check

      # tiktoken downloads GPT-2 assets on first use. Keep this network setup
      # separate from the tests, which can then reuse the local cache.
      - name: Prepare GPT-2 tokenizer assets
        run: uv run --locked python -c 'import tiktoken; tiktoken.get_encoding("gpt2")'

      - name: Run tests with warnings treated as errors
        run: uv run --locked pytest -q -W error
